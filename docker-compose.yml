version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-insight}
      POSTGRES_PASSWORD: ${DB_PASS:-insight}
      POSTGRES_DB: ${DB_NAME:-insightdb}
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]

  api:
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DB_URL: postgresql+psycopg2://insight:insight@db:5432/insightdb
      STORAGE_DIR: /app/storage
    volumes:
      - ./:/app
      - modelstore:/app/storage
    ports: ["8000:8000"]
    depends_on: [db]

  dashboard:
    build: .
    command: streamlit run src/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      API_BASE: http://api:8000
    volumes:
      - ./:/app
    ports: ["8501:8501"]
    depends_on: [api]

volumes:
  dbdata:
  modelstore:
