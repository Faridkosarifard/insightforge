[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "insightforge"
dynamic = ["version"]
description = "Upload a CSV, run exploratory analysis, train a baseline model, and score new rows."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Farid Kosarifard" }]
maintainers = [{ name = "Farid Kosarifard" }]
keywords = ["fastapi", "streamlit", "automl", "eda", "machine-learning", "data-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "sqlalchemy>=2.0.35,<3",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.9",
    "joblib>=1.4",
    "streamlit>=1.38",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-requests>=2.32",
]

[project.urls]
Homepage = "https://github.com/Faridkosarifard/insightforge"
Repository = "https://github.com/Faridkosarifard/insightforge"
Issues = "https://github.com/Faridkosarifard/insightforge/issues"
Changelog = "https://github.com/Faridkosarifard/insightforge/blob/main/CHANGELOG.rst"

[tool.hatch.version]
path = "src/insightforge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/insightforge"]

[tool.hatch.build.targets.sdist]
include = ["src/insightforge", "tests", "docs", "data", "README.md", "CHANGELOG.rst", "CONTRIBUTING.rst", "LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH", "N", "C4", "PL"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0912", "PLR0915", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]
"src/insightforge/dashboard/app.py" = ["T201"]
"src/insightforge/api/main.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["insightforge"]

[[tool.mypy.overrides]]
module = [
    "sklearn",
    "sklearn.*",
    "joblib",
    "joblib.*",
    "streamlit",
    "streamlit.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["insightforge"]
branch = true
omit = ["*/insightforge/dashboard/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
